<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
@page{size:90mm 110mm;margin:0}
.card{width:90mm;height:110mm;position:relative}
.half{width:90mm;height:55mm;position:relative;overflow:hidden}
.back{transform:rotate(180deg)}
.fold{position:absolute;top:55mm;left:0;width:100%;border-top:0.2mm dashed rgba(255,255,255,.35)}
.name{position:absolute;top:13mm;width:100%;text-align:center;font-weight:500;font-size:22pt;letter-spacing:.2px}
.sub{position:absolute;top:27mm;width:100%;text-align:center;font-weight:300;font-size:8pt;opacity:.9}
.lock{position:absolute;bottom:5mm;left:50%;transform:translateX(-50%);width:34mm;height:11.5mm}
.lock img{width:37.8mm;top:-63.7mm}
.chars{position:absolute;right:-6mm;bottom:0;width:30mm;height:30mm}
.lockt{position:absolute;left:0;right:0;text-align:center;line-height:1}.lockt b{display:block;font-weight:300;letter-spacing:-.3px}.lockt span{display:block;font-weight:500;margin-top:.8mm}</style></head><body>
<div class="card bg">
 <div class="half back bg"><div class="name" style="top:15mm">{Guest Name}</div><div class="sub" style="top:29mm">Creator &amp; Community Dinner</div><div class="lockt" style="bottom:5mm"><b style="font-size:11pt">Elevate EMEA 2026</b><span style="font-size:6.5pt">by monday.com</span></div></div>
 <div class="half bg"><div class="name">{Guest Name}</div><div class="sub">Creator &amp; Community Dinner · Balthazar · 23.11.2026</div><div class="lockt" style="bottom:5mm"><b style="font-size:11pt">Elevate EMEA 2026</b><span style="font-size:6.5pt">by monday.com</span></div><span class="spark" style="left:7mm;top:6mm;font-size:9pt">✦</span><span class="spark" style="right:9mm;top:9mm;font-size:6pt">✦</span></div>
 <div class="fold"></div>
</div></body></html>
