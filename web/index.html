<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilan's Command Center</title>
<style>
:root{--bg:#f4f4f6;--panel:#fff;--line:#e8e8e8;--accent:#6C47FF;--accent-soft:#f0edff;--accent-line:#d4ccff;
--ok:#037f4c;--ok-soft:#f0fdf4;--danger:#dc2626;--slack:#4A154B;--slack-soft:#f9f0fa;--text:#334155;--text2:#666;--text3:#999}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none}
header h1{font-size:15px;margin:0}
header .date{color:var(--text2);font-size:11px}
.chip{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:11px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--text)}
button:hover{border-color:var(--accent-line)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{flex:1;display:flex;gap:12px;padding:0 16px 16px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
#timeline{flex:1;min-width:0}
#work{width:340px;flex:none}
.panel-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.scroll{overflow:auto;flex:1;position:relative}
.grid{position:relative;margin-left:44px;margin-right:8px}
.hour{position:absolute;left:-44px;width:40px;text-align:right;font-size:10px;color:var(--text3);transform:translateY(-6px)}
.hline{position:absolute;left:0;right:0;border-top:1px solid #f0f0f0}
.ev{position:absolute;border-radius:6px;padding:2px 6px;font-size:11px;overflow:hidden;border-left:3px solid;cursor:pointer;text-decoration:none;color:inherit}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:10px;color:var(--text2)}
.now{position:absolute;left:-4px;right:0;border-top:2px solid var(--danger);z-index:3}
.now:before{content:"";position:absolute;left:-2px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.allday{padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;flex:none}
.allday .tag{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px;padding:1px 8px;font-size:11px}
.msg{padding:24px;text-align:center;color:var(--text2)}
.msg.err{color:var(--danger)}
.msg code{display:block;margin:8px auto;color:var(--text3);font-size:11px;word-break:break-all}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font-size:11px;padding:3px 8px}
.soon{padding:24px;color:var(--text3);text-align:center}
#workbody{padding:0}
.stats{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.stat{flex:1;background:var(--bg);border-radius:8px;padding:4px 8px;text-align:center}
.stat b{display:block;font-size:15px}.stat span{font-size:10px;color:var(--text3)}
.stat.danger b{color:var(--danger)}
.sec{padding:8px 10px 2px;font-size:11px;font-weight:600;color:var(--text2);display:flex;justify-content:space-between}
.sec.personal{color:var(--slack)}
.row{padding:6px 10px;border-bottom:1px solid #f3f3f3;color:inherit}
.row:hover{background:var(--accent-soft)}
.row .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:grid;grid-template-columns:20px 1fr;column-gap:6px;align-items:start}
.row .cb{margin:2px 0 0;cursor:pointer}
.row .body{min-width:0}
.sync{grid-column:2;font-size:10px}
.sync.pending{color:var(--text3)}.sync.ok{color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:1px 6px;display:inline-block}
.sync.dry{color:var(--accent)}.sync.bad{color:var(--danger)}
.badge{background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:600}
.row .meta{font-size:10px;color:var(--text3);display:flex;gap:8px}
.row .meta .late{color:var(--danger)}
.row.sunk{opacity:.55}
.pri{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#cbd5e1}
.pri.high{background:var(--danger)}.pri.med{background:#f59e0b}.pri.low{background:#22c55e}
.banner{margin:8px 10px;padding:6px 8px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border-radius:12px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.dlg .warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:6px 8px;font-size:11px}
.dlg label{font-size:10px;color:var(--text3);display:block}
.dlg input,.dlg textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.dlg textarea{min-height:160px;resize:vertical}
.dlg .acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.dlg .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dlg .res{font-size:11px}
.grp{padding:6px 10px 2px;font-size:11px;font-weight:600;color:var(--text2);display:flex;justify-content:space-between}
.th{padding:6px 10px;border-bottom:1px solid #f3f3f3;cursor:pointer}
.th:hover{background:var(--accent-soft)}
.th .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .why{font-size:10px;color:var(--text3)}
.v{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:5px;letter-spacing:.3px}
.v.decision{background:#fee2e2;color:var(--danger)}.v.reply{background:var(--accent-soft);color:var(--accent)}
.v.waiting{background:#e0f2fe;color:#0369a1}.v.fyi,.v.untriaged{background:#f1f5f9;color:#64748b}
.thread{padding:6px 10px 10px 18px;background:#fafafa;border-bottom:1px solid var(--line);font-size:12px}
.msgb{border-left:2px solid var(--line);padding-left:8px;margin:6px 0;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
.msgb small{display:block;color:var(--text3)}
.sl-card{padding:6px 10px;border-bottom:1px solid #f3f3f3}
.sl-card .who{font-weight:600;font-size:12px;display:flex;justify-content:space-between}
.sl-card .who.ch{color:var(--slack)}
.sl-msg{font-size:11px;color:var(--text2);margin:2px 0;white-space:pre-wrap;word-break:break-word}
.sl-msg b{color:var(--text)}
.sl-card textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:60px;margin-top:4px}
.sl-act{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center}
.sl-act .res{font-size:10px}
.sl-sum{font-size:11px;background:var(--slack-soft);border-radius:6px;padding:4px 8px;margin-top:3px;white-space:pre-wrap}
.sl-ask{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--slack-soft)}
.sl-ask textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:44px}
.sl-head{padding:8px 10px 2px;font-size:11px;font-weight:600;color:var(--text2)}
.rq{padding:6px 10px;border-bottom:1px solid #f3f3f3}
.rq .top{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.rq .nm{flex:1;min-width:0;text-decoration:none;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq .meta{font-size:10px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rq .meta .late{color:var(--danger)}
.rq .last{font-size:10px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq .acts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
.rq select,.rq textarea{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--panel);color:var(--text)}
.rq textarea{width:100%;min-height:50px;margin-top:4px}
.rq .res{font-size:10px}
.r{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;letter-spacing:.3px;white-space:nowrap}
.r.r0{background:#f1f5f9;color:#64748b}.r.r1{background:#fee2e2;color:var(--danger)}.r.r2{background:#fef3c7;color:#92400e}.r.r3{background:#e0f2fe;color:#0369a1}.r.r4{background:var(--ok-soft);color:var(--ok)}
.tier{font-size:9px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dc{padding:6px 10px;border-bottom:1px solid #f3f3f3}
.dc .top{display:flex;gap:6px;justify-content:space-between;align-items:flex-start}
.dc .nm{flex:1;min-width:0}
.dc .why{font-size:10px;color:var(--text3)}
.dc .acts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
.dc input{font:inherit;font-size:11px;flex:1;min-width:90px;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.dc .res{font-size:10px}
.amt{font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:4px;padding:0 5px;margin-right:4px}
.src{font-size:9px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--text3);white-space:nowrap}
.dc.done{opacity:.55}
.note{margin:8px 10px;padding:6px 8px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-size:11px}
.ag{padding:6px 10px;border-bottom:1px solid #f3f3f3}
.ag.off{opacity:.6}
.ag .top{display:flex;gap:6px;justify-content:space-between;align-items:flex-start}
.ag .nm{font-weight:600;font-size:12px}
.ag .sub,.ag .line{font-size:10px;color:var(--text3)}
.ag .flag{font-size:11px;border-radius:6px;padding:3px 6px;margin-top:3px}
.ag .flag.red{background:#fee2e2;color:var(--danger)}.ag .flag.amber{background:#fef3c7;color:#92400e}
.ag .acts{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap}
.ag .res{font-size:10px}
.ag label{font-size:11px;display:inline-flex;gap:4px;align-items:center}
.pill{font-size:9px;font-weight:700;border-radius:4px;padding:0 5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:#fee2e2;color:var(--danger)}.pill.unk{background:#fef3c7;color:#92400e}.pill.np{background:#f1f5f9;color:#64748b}
.chip.alert{background:#fee2e2;border-color:#fecaca;color:var(--danger)}
.hs{padding:8px 10px;border-bottom:1px solid var(--line)}
.hs .t{font-size:10px;color:var(--text3);margin-bottom:4px}
.hs .chips{display:flex;gap:4px;flex-wrap:wrap}
.hc{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.hc b{margin-left:3px}
.hc.zero{color:var(--ok);background:var(--ok-soft);border-color:#bbf7d0}
.hc.some{color:var(--danger);background:#fef2f2;border-color:#fecaca}
.hc.on{outline:2px solid var(--accent)}
.hl{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hl .hi{padding:5px 8px;border-bottom:1px solid #f3f3f3;font-size:11px}
.hl .hi:last-child{border-bottom:0}
.hl .hi a{color:inherit;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .hi span{color:var(--text3);font-size:10px}
@media (max-width:760px){main{flex-direction:column}#work{width:auto;height:180px}}
</style>
</head>
<body>
<header>
  <h1 id="greet">Ilan's Command Center</h1>
  <span class="date" id="dateline"></span>
  <span class="chip" id="nextup" hidden></span>
  <span class="chip alert" id="agentchip" hidden></span>
  <span class="badge" id="dry" hidden title="Board and Slack writes are disabled. Start the server with DRY_RUN=0 to enable them.">DRY RUN</span>
  <span class="spacer"></span>
  <button id="refresh" title="Re-pulls data. After a deploy, reload the page too.">Refresh</button>
</header>
<main>
  <section class="panel" id="timeline">
    <div class="panel-head" id="daytabs"></div>
    <div class="allday" id="allday" hidden></div>
    <div class="scroll" id="scroll"><div id="tlbody"></div></div>
  </section>
  <aside class="panel" id="work">
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats" hidden></div>
    <div class="scroll" id="workbody"></div>
  </aside>
</main>
<div id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-label="Compose reply">
  <div class="warn">This saves to your Gmail <b>Drafts</b>. Nothing is sent from here.</div>
  <div><label>To</label><input id="c-to"></div>
  <div><label>Cc</label><input id="c-cc"></div>
  <div><label>Subject</label><input id="c-sub"></div>
  <div><label>Body</label><textarea id="c-body" dir="auto"></textarea></div>
  <div style="display:flex;gap:6px"><input id="c-prompt" placeholder="Revise with a prompt, e.g. shorter, warmer, in Hebrew"><button id="c-rev">Revise</button></div>
  <div class="acts"><span class="res" id="c-res"></span><button id="c-reset">Reset</button><button id="c-close">Close</button><button class="primary" id="c-save">Save to Drafts</button></div>
</div></div>
<script>
const START_H = 8, END_H = 20, PX_PER_MIN = 1.15;
const state = { data: null, error: null, day: 0, loading: false };
const $ = (id) => document.getElementById(id);

// Title-keyword colours (border, background).
const COLOURS = [
  [/interview|press|media|journalist|podcast/i, ['#6C47FF', '#f0edff']],
  [/elevate|event|panel|keynote/i, ['#d97706', '#fffbeb']],
  [/agency|brazil|mexico|latam|scherf/i, ['#037f4c', '#f0fdf4']],
  [/1:1|1-1|sync|check-?in|stand-?up/i, ['#0284c7', '#f0f9ff']],
  [/lunch|doctor|dentist|family|personal|רופא|אישי/i, ['#be185d', '#fdf2f8']],
];
function colourFor(title) {
  for (const [re, c] of COLOURS) if (re.test(title)) return c;
  return ['#64748b', '#f1f5f9'];
}

function parts(iso, tz) {
  // Date key (YYYY-MM-DD) and minutes-from-midnight in the configured tz.
  const d = new Date(iso);
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const p = Object.fromEntries(f.formatToParts(d).map((x) => [x.type, x.value]));
  return { key: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute, label: `${p.hour}:${p.minute}` };
}
function addDays(key, n) {
  const d = new Date(key + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function load() {
  state.loading = true; render();
  try {
    const r = await fetch('/api/calendar?days=4');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    state.data = j; state.error = null;
    console.log(`loaded: ${j.events.length} calendar events`);
  } catch (e) {
    state.error = e.message; console.error('calendar load failed', e);
  }
  state.loading = false; render();
}

function layout(events, tz, dayKey) {
  // Timed events for one day, packed into side-by-side columns when they overlap.
  const items = events.filter((e) => !e.allDay).map((e) => {
    const s = parts(e.start, tz), en = parts(e.end, tz);
    let startMin = s.key < dayKey ? 0 : s.min;
    let endMin = en.key > dayKey ? 24 * 60 : en.min;
    if (s.key > dayKey || en.key < dayKey) return null;
    if (endMin <= startMin) endMin = startMin + 15;
    return { e, startMin, endMin, s, en };
  }).filter(Boolean).sort((a, b) => a.startMin - b.startMin);
  const cols = [];
  for (const it of items) {
    let c = cols.findIndex((last) => last <= it.startMin);
    if (c === -1) { c = cols.length; cols.push(0); }
    cols[c] = it.endMin; it.col = c;
  }
  // Column count per overlapping cluster (simple: global max within overlap group).
  for (const it of items) {
    it.n = Math.max(...items.filter((o) => o.startMin < it.endMin && o.endMin > it.startMin).map((o) => o.col)) + 1;
  }
  return items;
}

function render() {
  const d = state.data;
  $('refresh').textContent = state.loading ? '…' : 'Refresh';
  if (d) {
    const dt = new Date(d.today + 'T12:00:00Z');
    $('dateline').textContent = dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  }
  // Day tabs
  const tabs = ['Today', '+1', '+2', '+3'].map((l, i) => `<button class="${i === state.day ? 'on' : ''}" data-d="${i}">${l}</button>`).join('');
  $('daytabs').innerHTML = tabs;
  $('daytabs').querySelectorAll('button').forEach((b) => b.onclick = () => { state.day = +b.dataset.d; render(); });

  const body = $('tlbody');
  $('allday').hidden = true; $('nextup').hidden = true;
  if (state.error) {
    body.innerHTML = `<div class="msg err">Calendar unavailable<code>${esc(state.error)}</code><button id="retry">Retry</button></div>`;
    $('retry').onclick = load; return;
  }
  if (!d) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }

  const dayKey = addDays(d.today, state.day);
  const adEvents = d.events.filter((e) => e.allDay && e.start <= dayKey && e.end > dayKey);
  if (adEvents.length) { $('allday').hidden = false; $('allday').innerHTML = adEvents.map((e) => `<span class="tag">${esc(e.title)}</span>`).join(''); }

  const items = layout(d.events, d.tz, dayKey);
  const H = (END_H - START_H) * 60 * PX_PER_MIN;
  let html = `<div class="grid" style="height:${H + 12}px;margin-top:10px">`;
  for (let h = START_H; h <= END_H; h++) {
    const y = (h - START_H) * 60 * PX_PER_MIN;
    html += `<div class="hline" style="top:${y}px"></div><div class="hour" style="top:${y}px">${String(h).padStart(2, '0')}:00</div>`;
  }
  for (const it of items) {
    const top = (Math.max(it.startMin, START_H * 60) - START_H * 60) * PX_PER_MIN;
    const bottom = (Math.min(it.endMin, END_H * 60) - START_H * 60) * PX_PER_MIN;
    if (bottom <= 0 || top >= H) continue;
    const [bc, bg] = colourFor(it.e.title);
    const w = 100 / it.n;
    html += `<a class="ev" href="${esc(it.e.link || '#')}" target="_blank" rel="noopener" style="top:${top}px;height:${Math.max(bottom - top, 18)}px;left:${it.col * w}%;width:calc(${w}% - 3px);background:${bg};border-color:${bc}"><b>${esc(it.e.title)}</b><span>${it.s.label}–${it.en.label}</span></a>`;
  }
  const nowP = parts(new Date().toISOString(), d.tz);
  if (state.day === 0 && nowP.key === d.today && nowP.min >= START_H * 60 && nowP.min <= END_H * 60) {
    html += `<div class="now" style="top:${(nowP.min - START_H * 60) * PX_PER_MIN}px"></div>`;
  }
  html += '</div>';
  if (!items.length && !adEvents.length) html += '<div class="msg">Nothing scheduled.</div>';
  body.innerHTML = html;

  // Next-up chip: next event today that hasn't started yet.
  const todays = layout(d.events, d.tz, d.today);
  const next = todays.find((it) => it.startMin > nowP.min);
  if (next && nowP.key === d.today) { $('nextup').hidden = false; $('nextup').textContent = `Next: ${next.s.label} ${next.e.title}`; }
}


// ---------- Tasks tab (R-01..R-03, R-14, R-17, R-18, R-21) ----------
const ui = { tab: 'tasks' };
const hs = { open: null };
const tasks = { data: null, error: null, loading: false, touched: new Set(), rows: {} };
const META = /comms calendar sync|daily inbox digest|morning-board|pepper-eod/i;
const HEALTH = /רופא|בדיק|דם|נוירולוג|רפוא|doctor|medical|health|appointment|🩺/i;
const PRI = { '🔥 High': 0, '🟡 Medium': 1, '🟢 Low': 2 };

function buildTaskView(d) {
  const g = d.config.groups, c = g.canonical;
  const hidden = new Set([c.completed.id, g.parking.recurring, g.parking.noise]);
  const view = { today: [], overdue: [], week: [], active: [], personal: [], hiddenCount: 0, total: 0 };
  for (const t of d.items) {
    if (hidden.has(t.group) || t.status === 'Done' || t.status === 'Not Relevant' || META.test(t.name)) { view.hiddenCount++; continue; }
    if (t.group === g.personal) { view.personal.push(t); continue; }
    const inToday = t.group === c.today.id;
    const blocked = t.group === c.waiting.id || t.status === 'With steakholder'; // R-14: blocked work never counts overdue
    const due = t.deadline || '';
    if (inToday || (due && due === d.today && !blocked)) view.today.push(t);          // R-02
    else if (due && due < d.today && !blocked) view.overdue.push(t);
    else if (t.group === c.thisWeek.id) view.week.push(t);
    else view.active.push(t);
  }
  const rank = (t) => (t.priority in PRI ? PRI[t.priority] : 3);
  const sink = (t) => (tasks.touched.has(t.id) ? 1 : 0);                                  // R-03
  const cmp = (a, b) => sink(a) - sink(b) || rank(a) - rank(b) || (a.deadline || '9999').localeCompare(b.deadline || '9999') || a.name.localeCompare(b.name);
  for (const k of ['today', 'overdue', 'week', 'active']) view[k].sort(cmp);
  // R-17 / R-18: personal track, max 3, health first.
  view.personal.sort((a, b) => (HEALTH.test(b.name) - HEALTH.test(a.name)) || cmp(a, b));
  view.personalMore = Math.max(0, view.personal.length - 3);
  view.personal = view.personal.slice(0, 3);
  view.total = view.today.length + view.overdue.length + view.week.length + view.active.length;
  return view;
}

function daysLate(due, today) { return Math.round((Date.parse(today) - Date.parse(due)) / 86400000); }

function taskRow(t, d, kind) {
  const pc = t.priority.includes('High') ? 'high' : t.priority.includes('Medium') ? 'med' : t.priority.includes('Low') ? 'low' : '';
  const url = `https://monday.monday.com/boards/${d.config.board}/pulses/${t.id}`;
  const late = kind === 'overdue' ? `<span class="late">${daysLate(t.deadline, d.today)}d late</span>` : '';
  const date = t.deadline ? `<span>${esc(t.deadline.slice(5).split('-').reverse().join('.'))}</span>` : '';
  const st = tasks.rows[t.id] || {};
  const checked = st.cls === 'ok' || st.cls === 'bad-partial' ? 'checked' : '';
  return `<div class="row ${tasks.touched.has(t.id) ? 'sunk' : ''}" data-id="${t.id}"><input class="cb" type="checkbox" ${checked} ${st.cls === 'pending' ? 'disabled' : ''} aria-label="Mark done">`
    + `<div class="body"><a class="nm" href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><i class="pri ${pc}"></i>${esc(t.name)}</a><span class="meta">${date}${late}<span>${esc(t.status || '')}</span></span></div>`
    + (st.text ? `<div class="sync ${st.cls.replace('bad-partial', 'bad')}">${esc(st.text)}</div>` : '') + '</div>';
}

// Done-sync (principle 3): one action -> board status + Pepper DM. Never local-only.
async function doneSync(t, box) {
  tasks.rows[t.id] = { cls: 'pending', text: 'syncing…' }; renderWork();
  try {
    const r = await fetch('/api/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: t.id, name: t.name }) });
    const j = await r.json();
    if (j.dryRun) { tasks.rows[t.id] = { cls: 'dry', text: 'dry-run: would set Done on the board + DM Pepper' }; }
    else if (j.board === 'ok' && j.pepper === 'ok') { tasks.rows[t.id] = { cls: 'ok', text: '✓ Done · Pepper notified' }; tasks.touched.add(t.id); }
    else if (j.board === 'ok') { tasks.rows[t.id] = { cls: 'bad-partial', text: `Done on board, but Pepper was NOT notified: ${j.error || 'unknown error'}` }; tasks.touched.add(t.id); }
    else { tasks.rows[t.id] = { cls: 'bad', text: `Not done: ${j.error || 'board update failed'}` }; }
  } catch (e) { tasks.rows[t.id] = { cls: 'bad', text: `Not done: ${e.message}` }; }
  renderWork();
}

async function loadTasks() {
  tasks.loading = true; renderWork();
  try {
    const r = await fetch('/api/tasks'); const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    tasks.data = j; tasks.error = null;
    console.log(`loaded: ${j.items.length} tasks in ${j.pages} pages${j.truncated ? ' (TRUNCATED)' : ''}`);
  } catch (e) { tasks.error = e.message; console.error('tasks load failed', e); }
  tasks.loading = false; renderWork();
}

function renderWork() {
  if (ui.tab === 'email') return renderEmail();
  if (ui.tab === 'slack') return renderSlack();
  if (ui.tab === 'requests') return renderRequests();

// Board health strip: counts of known rule violations. Each count opens its proposal list. Nothing auto-fixes.
function healthStrip(d) {
  if (!d.health) return `<div class="banner">Board health unavailable: ${esc(d.healthError || 'no data')}. The task list is unaffected.</div>`;
  const open = d.health.find((r) => r.id === hs.open);
  return `<div class="hs"><div class="t">Board health · proposals only, nothing changes without your approval${d.truncated ? ' · partial board, counts incomplete' : ''}</div><div class="chips">`
    + d.health.map((r) => `<button class="hc ${r.count ? 'some' : 'zero'} ${hs.open === r.id ? 'on' : ''}" data-hr="${r.id}" title="${esc(r.label)}${r.heuristic ? ' (keyword guess)' : ''}">${r.id}${r.heuristic ? '~' : ''} ${esc(r.label)}<b>${r.count}</b></button>`).join('')
    + '</div>'
    + (open ? `<div class="hl">${open.items.length ? open.items.map((i) => `<div class="hi"><a href="https://monday.monday.com/boards/${d.config.board}/pulses/${esc(i.id)}" target="_blank" rel="noopener">${esc(i.name)}</a><span>${esc(i.proposal)}</span></div>`).join('') : '<div class="hi"><span>Nothing to fix.</span></div>'}</div>` : '')
    + '</div>';
}

function renderTasks() {
  const body = $('workbody'), stats = $('stats');
  stats.hidden = true;
  if (tasks.error) { body.innerHTML = `<div class="msg err">Tasks unavailable<code>${esc(tasks.error)}</code><button id="retryT">Retry</button></div>`; $('retryT').onclick = loadTasks; return; }
  if (!tasks.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = tasks.data, v = buildTaskView(d);
  stats.hidden = false;
  stats.innerHTML = `<div class="stat"><b>${v.today.length}</b><span>Today</span></div><div class="stat danger"><b>${v.overdue.length}</b><span>Overdue</span></div><div class="stat"><b>${v.total}</b><span>Total</span></div>`;
  const cap = d.config.groups.canonical.today.cap;
  const sec = (label, list, kind, extra = '') => list.length ? `<div class="sec ${kind === 'personal' ? 'personal' : ''}"><span>${label} · ${list.length}${extra}</span></div>${list.map((t) => taskRow(t, d, kind)).join('')}` : '';
  let html = healthStrip(d);
  if (d.truncated) html += `<div class="banner">Showing a partial board: pagination hit the ${d.pages}-page cap. Counts are incomplete.</div>`;
  if (v.today.length > cap) html += `<div class="banner">🔥 Today holds ${v.today.length} items (cap ${cap}).</div>`;
  html += sec('🔥 Today', v.today, 'today') + sec('🔴 Overdue', v.overdue, 'overdue') + sec('📅 This Week', v.week, 'week') + sec('📦 Active', v.active, 'active');
  html += sec('👨‍👩 אישי', v.personal, 'personal', v.personalMore ? ` (+${v.personalMore} more)` : '');
  if (!v.total && !v.personal.length) html += '<div class="msg">Nothing open.</div>';
  body.innerHTML = html;
  $('dry').hidden = !d.dryRun;
  body.querySelectorAll('button[data-hr]').forEach((b) => b.onclick = () => { hs.open = hs.open === b.dataset.hr ? null : b.dataset.hr; renderWork(); });
  const all = [...v.today, ...v.overdue, ...v.week, ...v.active, ...v.personal];
  body.querySelectorAll('.row .cb').forEach((cb) => {
    const t = all.find((x) => x.id === cb.closest('.row').dataset.id);
    cb.onchange = () => (cb.checked ? doneSync(t, cb) : (delete tasks.rows[t.id], renderWork()));
  });
}

// ---------- Email tab (drafts only; R-19, R-22) ----------
const email = { data: null, error: null, loading: false, open: new Set(), threads: {}, compose: null };
const VORDER = { decision: 0, reply: 1, untriaged: 2, fyi: 3, waiting: 4 };
const VLABEL = { decision: 'DECISION (yours)', reply: 'REPLY', waiting: 'WAITING ON THEM', fyi: 'FYI', untriaged: 'UNTRIAGED' };
const URG = { high: 0, med: 1, low: 2 };

async function loadEmail() {
  email.loading = true; if (ui.tab === 'email') renderWork();
  try {
    const r = await fetch('/api/email'); const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    email.data = j; email.error = null;
    console.log(`loaded: ${j.threads.length} email threads${j.triageOk ? '' : ' (UNTRIAGED)'}`);
  } catch (e) { email.error = e.message; console.error('email load failed', e); }
  email.loading = false; if (ui.tab === 'email' || ui.tab === 'decisions') renderWork();
}

async function loadThread(id) {
  email.threads[id] = 'loading'; renderWork();
  try {
    const r = await fetch('/api/email/thread?id=' + encodeURIComponent(id)); const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    email.threads[id] = j.messages;
  } catch (e) { email.threads[id] = { error: e.message }; }
  renderWork();
}

function renderEmail() {
  const body = $('workbody'); $('stats').hidden = true;
  if (email.error) { body.innerHTML = `<div class="msg err">Email unavailable<code>${esc(email.error)}</code><button id="retryE">Retry</button></div>`; $('retryE').onclick = loadEmail; return; }
  if (!email.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = email.data;
  let html = '';
  if (!d.triageOk) html += `<div class="banner">Triage failed, showing threads untriaged: ${esc(d.triageError || 'unknown')}. <button id="retryTri">Retry</button></div>`;
  // Group by sender; best verdict (then urgency, then recency) decides group order.
  const groups = new Map();
  for (const t of d.threads) { const k = t.fromEmail || t.from; (groups.get(k) || groups.set(k, []).get(k)).push(t); }
  const rank = (t) => [VORDER[t.verdict] ?? 9, URG[t.urgency] ?? 3, -t.date];
  const cmp = (a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
  const list = [...groups.values()].map((ts) => ts.sort(cmp)).sort((a, b) => cmp(a[0], b[0]));
  for (const ts of list) {
    html += `<div class="grp"><span>${esc(ts[0].from)}</span><span>${ts.length}</span></div>`;
    for (const t of ts) {
      const open = email.open.has(t.id), msgs = email.threads[t.id];
      html += `<div class="th" data-id="${esc(t.id)}"><span class="sub"><span class="v ${t.verdict}">${VLABEL[t.verdict]}</span>${esc(t.subject)}</span>${t.reason ? `<span class="why">${esc(t.reason)}</span>` : ''}</div>`;
      if (open) {
        html += '<div class="thread">';
        if (msgs === 'loading' || !msgs) html += 'Loading thread…';
        else if (msgs.error) html += `<span style="color:var(--danger)">Thread failed to load: ${esc(msgs.error)}</span> <button data-retry="${esc(t.id)}">Retry</button>`;
        else html += msgs.map((m) => `<div class="msgb"><small>${esc(m.from)}</small>${esc(m.body)}</div>`).join('');
        if (t.verdict === 'decision') html += '<div class="why" style="margin-top:6px"><b>This is a decision, not a draft.</b> Nothing to delegate; it is yours to make.</div>';
        else if (t.verdict === 'waiting') html += '<div class="why" style="margin-top:6px">Your reply was last. The ball is with them.</div>';
        else html += `<div style="margin-top:6px"><button data-draft="${esc(t.id)}">Draft reply</button></div>`;
        html += '</div>';
      }
    }
  }
  if (!d.threads.length) html += '<div class="msg">Inbox is clear.</div>';
  body.innerHTML = html;
  const rt = $('retryTri'); if (rt) rt.onclick = loadEmail;
  body.querySelectorAll('.th').forEach((el) => el.onclick = () => {
    const id = el.dataset.id;
    if (email.open.has(id)) email.open.delete(id); else { email.open.add(id); if (!email.threads[id]) loadThread(id); }
    renderWork();
  });
  body.querySelectorAll('[data-retry]').forEach((b) => b.onclick = () => loadThread(b.dataset.retry));
  body.querySelectorAll('[data-draft]').forEach((b) => b.onclick = () => openCompose(d.threads.find((t) => t.id === b.dataset.draft)));
}

function openCompose(t) {
  email.compose = { t, original: t.proposedBody || '' };
  $('c-to').value = t.replyTo || t.fromEmail; $('c-cc').value = '';
  $('c-sub').value = /^re:/i.test(t.subject) ? t.subject : 'Re: ' + t.subject;
  $('c-body').value = email.compose.original; $('c-prompt').value = ''; $('c-res').textContent = '';
  $('modal').hidden = false;
}
$('c-close').onclick = () => { $('modal').hidden = true; };
$('c-reset').onclick = () => { $('c-body').value = email.compose.original; };
$('c-rev').onclick = async () => {
  const b = $('c-rev'); b.textContent = '…';
  try {
    const r = await fetch('/api/email/revise', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ body: $('c-body').value, prompt: $('c-prompt').value }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    $('c-body').value = j.body; b.textContent = '✓';
  } catch (e) { $('c-res').textContent = 'Revise failed: ' + e.message; $('c-res').style.color = 'var(--danger)'; b.textContent = 'Revise'; return; }
  setTimeout(() => { b.textContent = 'Revise'; }, 3000);
};
$('c-save').onclick = async () => {
  const res = $('c-res'), t = email.compose.t; res.style.color = 'var(--text3)'; res.textContent = 'saving…';
  try {
    const r = await fetch('/api/email/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ threadId: t.id, to: $('c-to').value, cc: $('c-cc').value, subject: $('c-sub').value, body: $('c-body').value, inReplyTo: t.lastMessageId }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    res.style.color = j.dryRun ? 'var(--accent)' : 'var(--ok)';
    res.textContent = j.dryRun ? 'dry-run: ' + j.would : '✓ Saved to Drafts (not sent)';
  } catch (e) { res.style.color = 'var(--danger)'; res.textContent = 'Not saved: ' + e.message; }
};

// ---------- Slack tab (reads; sends only on explicit click) ----------
const sl = { data: null, error: null, loading: false, drafts: {}, res: {}, sums: {}, ask: { text: '', baseline: undefined, reply: null, msg: '' }, active: null };

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const j = await r.json(); if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`); return j;
}

async function loadSlack() {
  sl.loading = true; if (ui.tab === 'slack') renderWork();
  try {
    sl.data = await api('/api/slack'); sl.error = null;
    console.log(`loaded: ${sl.data.dms.length} DMs, ${sl.data.channels.length} channels`);
  } catch (e) { sl.error = e.message; console.error('slack load failed', e); }
  sl.loading = false; if (ui.tab === 'slack') renderWork();
  // One summary call per channel, patched in as each resolves.
  if (sl.data) for (const c of sl.data.channels) summarizeChannel(c.id);
}
async function summarizeChannel(id) {
  sl.sums[id] = { state: 'loading' }; if (ui.tab === 'slack') renderWork();
  try { sl.sums[id] = { state: 'ok', text: (await api('/api/slack/summary?channel=' + encodeURIComponent(id))).summary }; }
  catch (e) { sl.sums[id] = { state: 'err', text: e.message }; }
  if (ui.tab === 'slack') renderWork();
}

function renderSlack() {
  const body = $('workbody'); $('stats').hidden = true;
  if (sl.error) { body.innerHTML = `<div class="msg err">Slack unavailable<code>${esc(sl.error)}</code><button id="retryS">Retry</button></div>`; $('retryS').onclick = loadSlack; return; }
  if (!sl.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = sl.data, a = sl.ask;
  let html = `<div class="sl-ask"><textarea id="ask-t" dir="auto" placeholder="Ask Pepper (she answers in Slack)…">${esc(a.text)}</textarea><div class="sl-act"><button id="ask-send">Ask Pepper</button>${a.baseline !== undefined ? '<button id="ask-check">Check reply</button>' : ''}<span class="res" id="ask-res" style="color:var(--text3)">${esc(a.msg)}</span></div>`
    + (a.reply ? `<div class="sl-sum" dir="auto">${esc(a.reply)}</div>${sl.active ? '<div class="sl-act"><button id="ask-use">Use this as my reply</button></div>' : ''}` : '') + '</div>';
  if (d.truncated) html += `<div class="banner">Only ${d.scanned} DM conversations were scanned. Some unread DMs may be missing.</div>`;
  if (d.notFound.length) html += `<div class="banner">Not found or no access: ${d.notFound.map((n) => '#' + esc(n)).join(', ')}.</div>`;
  html += `<div class="sl-head">Unread DMs · ${d.dms.length}</div>`;
  for (const dm of d.dms) {
    const draft = sl.drafts[dm.channel], r = sl.res[dm.channel];
    html += `<div class="sl-card" data-ch="${esc(dm.channel)}"><div class="who"><span>${esc(dm.who)}</span><span>${dm.count}</span></div>`
      + dm.messages.map((m) => `<div class="sl-msg"><b>${esc(m.from)}</b> ${esc(m.text)}</div>`).join('')
      + (draft !== undefined ? `<textarea dir="auto" data-draft="${esc(dm.channel)}">${esc(draft)}</textarea>` : '')
      + `<div class="sl-act"><button data-act="draft" data-ch="${esc(dm.channel)}">${draft === undefined ? 'Draft reply' : 'Redraft'}</button>`
      + (draft !== undefined ? (dm.userId ? `<button data-act="send" data-ch="${esc(dm.channel)}">Send</button>` : '') + `<button data-act="pepper" data-ch="${esc(dm.channel)}">📢 Send draft to Pepper</button>` : '')
      + (r ? `<span class="res" style="color:${r.bad ? 'var(--danger)' : 'var(--ok)'}">${esc(r.text)}</span>` : '') + '</div></div>';
  }
  if (!d.dms.length) html += '<div class="msg" style="padding:10px">No unread DMs.</div>';
  html += `<div class="sl-head">Channels · ${d.channels.length}</div>`;
  for (const c of d.channels) {
    const sm = sl.sums[c.id] || {};
    html += `<div class="sl-card"><div class="who ch"><span>#${esc(c.name)}</span><span>${c.count}</span></div>`
      + (sm.state === 'ok' ? `<div class="sl-sum" dir="auto">${esc(sm.text)}</div>` : sm.state === 'err' ? `<div class="sl-msg" style="color:var(--danger)">Summary failed: ${esc(sm.text)} <button data-act="resum" data-ch="${esc(c.id)}">Retry</button></div>` : '<div class="sl-msg">summarising…</div>') + '</div>';
  }
  if (!d.channels.length) html += '<div class="msg" style="padding:10px">No unread in key channels.</div>';
  body.innerHTML = html;

  const T = $('ask-t'); T.oninput = () => { a.text = T.value; };
  $('ask-send').onclick = async () => {
    a.msg = 'sending…'; renderWork();
    try { const j = await api('/api/slack/pepper/ask', { text: a.text }); a.baseline = j.baseline ? j.baseline.text : null; a.reply = null; a.msg = j.dryRun ? 'dry-run: ' + j.would : 'Sent. Press "Check reply" in a moment.'; if (!j.dryRun) a.text = ''; }
    catch (e) { a.msg = 'Not sent: ' + e.message; }
    renderWork();
  };
  const ck = $('ask-check'); if (ck) ck.onclick = async () => {
    a.msg = 'checking…'; renderWork();
    try { const j = await api('/api/slack/pepper'); const t = j.latest ? j.latest.text : null; if (t && t !== a.baseline) { a.reply = t; a.msg = 'New reply from Pepper.'; } else { a.msg = 'No new reply yet.'; } }
    catch (e) { a.msg = 'Check failed: ' + e.message; }
    renderWork();
  };
  const use = $('ask-use'); if (use) use.onclick = () => { sl.drafts[sl.active] = a.reply; a.msg = 'Copied into the draft.'; renderWork(); };
  body.querySelectorAll('textarea[data-draft]').forEach((t) => { t.oninput = () => { sl.drafts[t.dataset.draft] = t.value; }; t.onfocus = () => { sl.active = t.dataset.draft; }; });
  body.querySelectorAll('button[data-act]').forEach((b) => b.onclick = async () => {
    const ch = b.dataset.ch, dm = d.dms.find((x) => x.channel === ch);
    if (b.dataset.act === 'resum') return summarizeChannel(ch);
    sl.active = ch; sl.res[ch] = { text: '…' };
    try {
      if (b.dataset.act === 'draft') { sl.drafts[ch] = (await api('/api/slack/draft', { channel: ch })).draft; sl.res[ch] = null; }
      else if (b.dataset.act === 'send') { const j = await api('/api/slack/send', { userId: dm.userId, text: sl.drafts[ch] }); sl.res[ch] = { text: j.dryRun ? 'dry-run: ' + j.would : '✓ Sent' }; }
      else if (b.dataset.act === 'pepper') { const j = await api('/api/slack/pepper/ask', { text: `📢 טיוטת תשובה ל-${dm.who}:\n«${sl.drafts[ch]}»` }); sl.res[ch] = { text: j.dryRun ? 'dry-run: ' + j.would : '✓ Sent to Pepper' }; }
    } catch (e) { sl.res[ch] = { bad: true, text: 'Failed: ' + e.message }; }
    renderWork();
  });
}

// ---------- Requests tab (Switchboard board; "whose turn" ladder) ----------
const rq = { data: null, error: null, loading: false, touched: new Set(), res: {}, open: new Set(), drafts: {} };
const RUNG = { 0: 'BOT ONLY', 1: 'THEIR REPLY', 2: 'YOU REPLIED, DUE SOON', 3: 'YOU REPLIED', 4: 'TOUCHED' };

async function loadRequests() {

function renderRequests() {
  const body = $('workbody'); $('stats').hidden = true;
  if (rq.error) { body.innerHTML = `<div class="msg err">Requests unavailable<code>${esc(rq.error)}</code><button id="retryR">Retry</button></div>`; $('retryR').onclick = loadRequests; return; }
  if (!rq.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = rq.data;
  // Server order is the ladder; anything acted on this session sinks (rung 4), keeping the server order within it.
  const items = d.items.map((i, n) => ({ ...i, n, rung: rq.touched.has(i.id) ? 4 : i.rung })).sort((a, b) => a.rung - b.rung || a.n - b.n);
  let html = '';
  if (d.truncated) html += `<div class="banner">Pagination hit the ${d.pages}-page cap. The list is incomplete.</div>`;
  html += `<div class="sec"><span>Requests that are yours · ${items.length}</span></div>`;
  for (const i of items) {
    const last = (i.updates || [])[0], r = rq.res[i.id], late = i.deadline && i.deadline < d.today;
    html += `<div class="rq" data-id="${esc(i.id)}"><div class="top"><a class="nm" href="https://monday.monday.com/boards/18431118484/pulses/${esc(i.id)}" target="_blank" rel="noopener">${esc(i.name)}</a><span class="r r${i.rung}">${RUNG[i.rung]}</span></div>`
      + `<div class="meta">${i.tier ? `<span class="tier">${esc(i.tier.split(' ')[0])}</span>` : ''}${i.region ? `<span>${esc(i.region)}</span>` : ''}${i.deadline ? `<span class="${late ? 'late' : ''}">${esc(i.deadline.slice(5).split('-').reverse().join('.'))}${late ? ' (late)' : ''}</span>` : ''}</div>`
      + (last ? `<div class="last"><b>${esc(last.creatorName || 'unknown')}</b>: ${esc(last.text)}</div>` : '')
      + `<div class="acts"><select data-st="${esc(i.id)}" aria-label="Status">${d.statusLabels.map((l) => `<option ${l === i.status ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      + `<button data-upd="${esc(i.id)}">${rq.open.has(i.id) ? 'Close' : 'Post update'}</button>${r ? `<span class="res" style="color:${r.bad ? 'var(--danger)' : r.dry ? 'var(--accent)' : 'var(--ok)'}">${esc(r.text)}</span>` : ''}</div>`
      + (rq.open.has(i.id) ? `<textarea dir="auto" data-txt="${esc(i.id)}" placeholder="Write an update…">${esc(rq.drafts[i.id] || '')}</textarea><div class="acts"><button data-send="${esc(i.id)}">Post</button></div>` : '') + '</div>';
  }
  if (!items.length) html += '<div class="msg">No open requests are assigned to you.</div>';
  body.innerHTML = html; $('dry').hidden = !d.dryRun;
  body.querySelectorAll('select[data-st]').forEach((sel) => sel.onchange = () => rqAct(sel.dataset.st, '/api/requests/status', { label: sel.value }, `Status set to ${sel.value}`));
  body.querySelectorAll('button[data-upd]').forEach((b) => b.onclick = () => { const id = b.dataset.upd; rq.open.has(id) ? rq.open.delete(id) : rq.open.add(id); renderWork(); });
  body.querySelectorAll('textarea[data-txt]').forEach((t) => t.oninput = () => { rq.drafts[t.dataset.txt] = t.value; });
  body.querySelectorAll('button[data-send]').forEach((b) => b.onclick = () => rqAct(b.dataset.send, '/api/requests/update', { text: rq.drafts[b.dataset.send] || '' }, 'Update posted', () => { rq.open.delete(b.dataset.send); delete rq.drafts[b.dataset.send]; }));
}

async function rqAct(id, path, extra, okText, after) {
  rq.res[id] = { text: '…' }; renderWork();
  try {
    const j = await api(path, { id, ...extra });
    if (j.dryRun) rq.res[id] = { dry: true, text: 'dry-run: ' + j.would };
    else { rq.res[id] = { text: '✓ ' + okText }; rq.touched.add(id); if (extra.label) rq.data.items.find((x) => x.id === id).status = extra.label; if (after) after(); }
  } catch (e) { rq.res[id] = { bad: true, text: 'Failed: ' + e.message }; }
  renderWork();
}

// ---------- Decisions tab (principle 8 / R-19: a decision is yours, never a draft) ----------
const dc = { data: null, error: null, loading: false, res: {}, notes: {}, showResolved: false };

async function loadDecisions() {
  dc.loading = true; if (ui.tab === 'decisions') renderWork();
  if (!email.data && !email.loading) loadEmail(); // email decisions come from the Email tab's triage
  const names = email.data ? email.data.threads.flatMap((t) => [t.subject, t.from]).join('|').replace(/[&#]/g, ' ') : '';
  try { dc.data = await api('/api/decisions' + (names ? '?emails=' + encodeURIComponent(names) : '')); dc.error = null; console.log(`loaded: ${dc.data.items.length} board/seed decisions`); }
  catch (e) { dc.error = e.message; console.error('decisions load failed', e); }
  dc.loading = false; if (ui.tab === 'decisions') renderWork();
}

function allDecisions() {
  const d = dc.data, threads = email.data ? email.data.threads.filter((t) => t.verdict === 'decision') : [];
  const mailNames = email.data ? email.data.threads.map((t) => (t.subject + ' ' + t.from).toLowerCase()).join('\n') : '';
  const items = d.items.filter((i) => i.source !== 'seed' || !mailNames.includes(String(i.match || '').toLowerCase()));
  for (const t of threads) items.push({ key: 'email:' + t.id, source: 'email', name: t.subject, amount: '', value: 0, deadline: '', reason: `From ${t.from}${t.reason ? ': ' + t.reason : ''}` });
  return items;
}

function renderDecisions() {
  const body = $('workbody'); $('stats').hidden = true;
  if (dc.error) { body.innerHTML = `<div class="msg err">Decisions unavailable<code>${esc(dc.error)}</code><button id="retryD">Retry</button></div>`; $('retryD').onclick = loadDecisions; return; }
  if (!dc.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = dc.data, all = allDecisions(), open = all.filter((i) => !d.resolved[i.key]), done = all.filter((i) => d.resolved[i.key]);
  let html = '<div class="note">These are yours to decide. Nothing here drafts a reply or delegates.</div>';
  if (d.truncated) html += `<div class="banner">Pagination hit the ${d.pages}-page cap. Board decisions may be missing.</div>`;
  if (email.error) html += '<div class="banner">Email decisions are missing because the Email tab failed to load.</div>';
  else if (!email.data) html += '<div class="banner">Loading email decisions…</div>';
  const row = (i, isDone) => {
    const r = dc.res[i.key], res = d.resolved[i.key];
    return `<div class="dc ${isDone ? 'done' : ''}" data-key="${esc(i.key)}"><div class="top"><span class="nm">${i.amount ? `<span class="amt">${esc(i.amount)}</span>` : ''}${esc(i.name)}</span><span class="src">${i.source.toUpperCase()}</span></div>`
      + `<div class="why">${esc(i.reason)}${i.deadline ? ' · due ' + esc(i.deadline.slice(5).split('-').reverse().join('.')) : ''}</div>`
      + (isDone ? `<div class="why"><b>${esc(res.outcome)}</b>${res.note ? ': ' + esc(res.note) : ''}</div>`
        : `<div class="acts"><input data-note="${esc(i.key)}" placeholder="Note (optional)" value="${esc(dc.notes[i.key] || '')}"><button data-o="approved" data-k="${esc(i.key)}">Approve</button><button data-o="declined" data-k="${esc(i.key)}">Decline</button><button data-o="deferred" data-k="${esc(i.key)}">Defer</button></div>`)
      + (r ? `<div class="res" style="color:${r.bad ? 'var(--danger)' : r.dry ? 'var(--accent)' : 'var(--ok)'}">${esc(r.text)}</div>` : '') + '</div>';
  };
  html += `<div class="sec"><span>Open decisions · ${open.length}</span></div>` + open.sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || b.value - a.value).map((i) => row(i, false)).join('');
  if (!open.length) html += '<div class="msg" style="padding:10px">No open decisions.</div>';
  if (done.length) html += `<div class="sec"><span><a href="#" id="tgl" style="color:inherit">${dc.showResolved ? '▾' : '▸'} Resolved · ${done.length}</a></span></div>` + (dc.showResolved ? done.map((i) => row(i, true)).join('') : '');
  body.innerHTML = html;
  const tg = $('tgl'); if (tg) tg.onclick = (e) => { e.preventDefault(); dc.showResolved = !dc.showResolved; renderWork(); };
  body.querySelectorAll('input[data-note]').forEach((n) => n.oninput = () => { dc.notes[n.dataset.note] = n.value; });
  body.querySelectorAll('button[data-o]').forEach((b) => b.onclick = async () => {
    const key = b.dataset.k, item = all.find((x) => x.key === key);
    dc.res[key] = { text: '…' }; renderWork();
    try {
      const j = await api('/api/decisions/resolve', { key, outcome: b.dataset.o, note: dc.notes[key] || '', itemId: item.itemId });
      if (j.dryRun) dc.res[key] = { dry: true, text: 'dry-run: ' + j.would.join(' · ') };
      else { d.resolved[key] = { outcome: b.dataset.o, note: dc.notes[key] || '' }; dc.res[key] = { text: j.localOnly ? '✓ Saved on this computer only (no board item)' : '✓ Recorded on the board' }; }
    } catch (e) { dc.res[key] = { bad: true, text: 'Not recorded: ' + e.message }; }
    renderWork();
  });
}

// ---------- Agents tab (the fleet obeys "degrade loudly" too) ----------
const ag = { data: null, error: null, loading: false, res: {}, poll: null };

async function loadAgents() {
  ag.loading = true; if (ui.tab === 'agents') renderWork();
  try { ag.data = await api('/api/agents'); ag.error = null; console.log(`loaded: ${ag.data.agents.length} agents, ${ag.data.agents.filter((a) => a.flag).length} flagged`); }
  catch (e) { ag.error = e.message; console.error('agents load failed', e); }
  ag.loading = false; updateAgentChip(); if (ui.tab === 'agents') renderWork();
}
function updateAgentChip() {
  const n = ag.data ? ag.data.agents.filter((a) => a.flag && a.flag.level === 'red').length : 0;
  const c = $('agentchip'); c.hidden = !n; c.textContent = n ? `⚠ ${n} agent${n > 1 ? 's need' : ' needs'} attention` : '';
}
function relTime(ms, now) {
  const m = Math.round((now - ms) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 2880 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}
function fmtNext(ms, tz) { return new Date(ms).toLocaleString('en-GB', { timeZone: tz, weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }

function renderAgents() {
  const body = $('workbody'); $('stats').hidden = true;
  if (ag.error) { body.innerHTML = `<div class="msg err">Agents unavailable<code>${esc(ag.error)}</code><button id="retryA">Retry</button></div>`; $('retryA').onclick = loadAgents; return; }
  if (!ag.data) { body.innerHTML = '<div class="msg">Loading…</div>'; return; }
  const d = ag.data, now = d.now;
  const w = (a) => (a.flag ? (a.flag.level === 'red' ? 0 : 1) : a.enabled ? 2 : a.ported ? 3 : 4);
  const list = [...d.agents].sort((a, b) => w(a) - w(b) || a.name.localeCompare(b.name));
  const red = list.filter((a) => a.flag && a.flag.level === 'red').length, amber = list.filter((a) => a.flag && a.flag.level === 'amber').length;
  let html = `<div class="stats"><div class="stat"><b>${list.filter((a) => a.enabled).length}</b><span>Enabled</span></div><div class="stat danger"><b>${red + amber}</b><span>Need attention</span></div><div class="stat"><b>${list.filter((a) => !a.ported).length}</b><span>Not ported</span></div></div>`;
  for (const a of list) {
    const lr = a.lastRun, r = ag.res[a.id];
    const pill = !a.ported ? '<span class="pill np">NOT PORTED</span>' : lr ? (lr.ok === false || lr.delivery === 'failed' ? '<span class="pill bad">FAILED</span>' : lr.delivery === 'unknown' ? '<span class="pill unk">UNCONFIRMED</span>' : '<span class="pill ok">OK</span>') : '';
    html += `<div class="ag ${a.enabled ? '' : 'off'}" data-id="${esc(a.id)}"><div class="top"><span class="nm">${esc(a.name)}</span>${pill}</div>`
      + `<div class="sub">${esc(a.group)} · ${esc(a.schedule || a.cron)}</div>`
      + `<div class="line">Last: ${lr ? `${relTime(lr.at, now)}${lr.dryRun ? ' (dry-run)' : ''}${lr.summary ? ' · ' + esc(lr.summary) : ''}` : 'never'} · Next: ${a.nextRun ? fmtNext(a.nextRun, d.tz) : (a.enabled ? '—' : 'disabled')}</div>`
      + (a.flag ? `<div class="flag ${a.flag.level}">${a.flag.level === 'red' ? '🔴' : '🟠'} ${esc(a.flag.reason)}</div>` : '')
      + `<div class="acts"><label title="${a.ported ? '' : 'Not ported yet: no prompt.md'}"><input type="checkbox" data-tg="${esc(a.id)}" ${a.enabled ? 'checked' : ''} ${a.ported ? '' : 'disabled'}> Enabled</label>`
      + `<button data-run="${esc(a.id)}" ${a.ported && !a.running ? '' : 'disabled'}>${a.running ? 'Running…' : (d.dryRun ? 'Run now (dry-run)' : 'Run now')}</button>`
      + (r ? `<span class="res" style="color:${r.bad ? 'var(--danger)' : 'var(--ok)'}">${esc(r.text)}</span>` : '') + '</div></div>';
  }
  body.innerHTML = html;
  body.querySelectorAll('input[data-tg]').forEach((c) => c.onchange = async () => {
    const id = c.dataset.tg;
    try { await api('/api/agents/toggle', { id, enabled: c.checked }); ag.res[id] = { text: c.checked ? '✓ Enabled' : '✓ Disabled' }; }
    catch (e) { ag.res[id] = { bad: true, text: e.message }; }
    loadAgents();
  });
  body.querySelectorAll('button[data-run]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.run; ag.res[id] = { text: 'starting…' }; renderWork();
    try { await api('/api/agents/run', { id }); ag.res[id] = { text: 'Started. Refreshing…' }; pollAgents(); }
    catch (e) { ag.res[id] = { bad: true, text: e.message }; }
    renderWork();
  });
}
// After "Run now", re-read the fleet until nothing is running (max ~2 minutes).
function pollAgents(n = 0) {
  clearTimeout(ag.poll);
  ag.poll = setTimeout(async () => { await loadAgents(); if (n < 40 && ag.data && ag.data.agents.some((a) => a.running)) pollAgents(n + 1); }, 3000);
}

const TABS = [['tasks', 'Tasks'], ['requests', 'Requests'], ['email', 'Email'], ['slack', 'Slack'], ['decisions', 'Decisions'], ['agents', 'Agents']];
const LIVE_TABS = new Set(['tasks', 'requests', 'email', 'slack', 'decisions', 'agents']);
function renderTabs() {
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${ui.tab === k ? 'on' : ''}" ${LIVE_TABS.has(k) ? '' : 'disabled title="Next in the build order"'}>${l}</button>`).join('');
  $('tabs').querySelectorAll('button:not([disabled])').forEach((b) => b.onclick = () => { ui.tab = b.dataset.t; renderTabs(); if (ui.tab === 'email' && !email.data && !email.loading) loadEmail(); if (ui.tab === 'slack' && !sl.data && !sl.loading) loadSlack(); if (ui.tab === 'requests' && !rq.data && !rq.loading) loadRequests(); if (ui.tab === 'decisions' && !dc.data && !dc.loading) loadDecisions(); if (ui.tab === 'agents') loadAgents(); renderWork(); });
}
renderTabs();
$('refresh').onclick = () => { load(); loadTasks(); if (ui.tab === 'email') loadEmail(); else email.data = null; if (ui.tab === 'slack') loadSlack(); else sl.data = null; if (ui.tab === 'requests') loadRequests(); else rq.data = null; if (ui.tab === 'decisions') loadDecisions(); else dc.data = null; loadAgents(); };
const h = new Date().getHours();
$('greet').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', Ilan';
load(); loadTasks(); loadAgents();
setInterval(() => { if (state.data) render(); }, 60000); // keep now-line and next-up fresh
</script>
</body>
